name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install project and development dependencies
        run: python -m pip install --upgrade ".[dev]"

      - name: Check formatting
        run: python -m black --check src tests

      - name: Run tests
        run: python -m pytest -q
